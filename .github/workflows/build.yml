# Kurulum dosyasını (MyScreen-Setup.exe) kaynak koddan GitHub'ın kendi makinesinde üretir.
# - Her "v*" etiketinde: kurulumu üretir ve aynı adlı sürüme TASLAK olarak ekler; yayınlamak elle
#   onaylanır (SignPath'in "her sürüm elle onaylanır" şartıyla uyumlu).
# - Elle çalıştırınca (workflow_dispatch): yalnızca üretir, sonucu iş akışı çıktısı olarak saklar.
# Üçüncü taraf dosyalar scripts/fetch-vendor.ps1 ile resmi kaynaklarından, sabit sürüm ve SHA-256
# kontrolüyle indirilir. Kod imzalama eklendiğinde imza adımı "Kurulum dosyasını üret" ile
# "Yayına ekle" arasına girer.
name: Kurulum dosyası

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Üçüncü taraf dosyalar (ffmpeg, Virtual Display Driver)
        shell: pwsh
        run: ./scripts/fetch-vendor.ps1

      - name: Sürüm kontrolü
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq 'tag' -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Etiket ${{ github.ref_name }} ile package.json sürümü v$v uyuşmuyor"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Kurulum dosyasını üret
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Sabit adlı kopya ve özetler
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Copy-Item "dist/MyScreen-Setup-$v.exe" dist/MyScreen-Setup.exe
          Get-ChildItem dist -Filter 'MyScreen-Setup*.exe' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MyScreen-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/MyScreen-Setup.exe
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Yayına ekle (taslak)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "My Screen ${{ steps.ver.outputs.version }}" --notes "Kurulum dosyası GitHub Actions'ta kaynak koddan üretildi ($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID). Code signing policy: https://rcerdihan.github.io/my-screen/code-signing.html"
          }
          gh release upload $tag dist/MyScreen-Setup.exe "dist/MyScreen-Setup-${{ steps.ver.outputs.version }}.exe" dist/SHA256SUMS.txt --clobber
