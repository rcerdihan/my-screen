<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>My Screen</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #e8eaf0;
        font: 16px/1.5 system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        background: rgba(0, 0, 0, 0.82);
      }
      #overlay[hidden] {
        display: none;
      }
      #message {
        max-width: 28em;
        color: #c4c9d6;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #5b8cff;
        border: 0;
        border-radius: 10px;
        padding: 14px 28px;
      }
      button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <div id="overlay">
      <div id="message">Bilgisayara bağlanılıyor…</div>
      <button id="start" hidden>Tam ekran başlat</button>
    </div>
    <script src="client.js"></script>
  </body>
</html>
